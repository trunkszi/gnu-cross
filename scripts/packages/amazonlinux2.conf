# Amazon Linux 2 host packages. Sourcing this file only declares variables.
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=()
PKG_MANAGER="yum"
USE_PIP_CMAKE=true
USE_GCC10=false

PACKAGES=(
    "automake"
    "bison"
    "bzip2"
    "ca-certificates"
    "curl"
    "diffutils"
    "file"
    "flex"
    "gawk"
    "gdb"
    "git"
    "gperf"
    "help2man"
    "ncurses-devel"
    "openssl-devel"
    "libtool"
    "make"
    "patch"
    "pkgconfig"
    "python3"
    "python3-pip"
    "rsync"
    "texinfo"
    "unzip"
    "util-linux"
    "wget"
    "which"
    "xz"
)

pkg_prepare() {
    local status=0
    timeout 30 yum list available gcc10 >/dev/null 2>&1 || status=$?
    case "${status}" in
        0)
            PACKAGES+=("gcc10" "gcc10-c++" "libstdc++-static")
            USE_GCC10=true
            ;;
        1)
            # yum/dnf report an unavailable optional package with status 1.
            PACKAGES+=("gcc" "gcc-c++" "libstdc++-static")
            USE_GCC10=false
            ;;
        *) echo "Error: GCC 10 package discovery exited ${status}" >&2; return "${status}" ;;
    esac
}

pkg_extra() {
    if [[ "${USE_GCC10}" == true ]]; then
        if [[ -f /usr/bin/gcc && ! -L /usr/bin/gcc ]]; then
            ${SUDO_CMD} mv /usr/bin/gcc /usr/bin/gcc.old || return $?
        fi
        if [[ -f /usr/bin/g++ && ! -L /usr/bin/g++ ]]; then
            ${SUDO_CMD} mv /usr/bin/g++ /usr/bin/g++.old || return $?
        fi
        if [[ -f /usr/bin/c++ && ! -L /usr/bin/c++ ]]; then
            ${SUDO_CMD} mv /usr/bin/c++ /usr/bin/c++.old || return $?
        fi
        if [[ -f /usr/bin/cpp && ! -L /usr/bin/cpp ]]; then
            ${SUDO_CMD} mv /usr/bin/cpp /usr/bin/cpp.old || return $?
        fi
        ${SUDO_CMD} alternatives --install /usr/bin/gcc gcc /usr/bin/gcc10-gcc 100
        ${SUDO_CMD} alternatives --install /usr/bin/g++ g++ /usr/bin/gcc10-g++ 100
        ${SUDO_CMD} alternatives --install /usr/bin/c++ c++ /usr/bin/gcc10-c++ 100
        ${SUDO_CMD} alternatives --install /usr/bin/cpp cpp /usr/bin/gcc10-cpp 100
        ${SUDO_CMD} alternatives --auto gcc
        ${SUDO_CMD} alternatives --auto g++
        ${SUDO_CMD} alternatives --auto c++
        ${SUDO_CMD} alternatives --auto cpp
    fi
    if [[ "${USE_PIP_CMAKE}" == true ]]; then
        ${SUDO_CMD} python3 -m pip install cmake
        export PATH="/usr/local/bin:${PATH}"
    fi
}
