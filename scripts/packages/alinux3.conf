# Alibaba Cloud Linux 3 host packages. Sourcing this file only declares variables.
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=()
PKG_MANAGER="dnf"
USE_PIP_CMAKE=true
USE_GCC10=false

PACKAGES=(
    "automake"
    "bison"
    "bzip2"
    "ca-certificates"
    "curl"
    "diffutils"
    "file"
    "flex"
    "gawk"
    "gdb"
    "git"
    "gperf"
    "help2man"
    "ncurses-devel"
    "openssl-devel"
    "libtool"
    "make"
    "patch"
    "pkgconfig"
    "python3.11"
    "python3.11-pip"
    "rsync"
    "texinfo"
    "unzip"
    "util-linux"
    "wget"
    "which"
    "xz"
    "gcc"
    "gcc-c++"
    "libstdc++-static"
)

pkg_extra() {
    if [[ -f /usr/bin/python3.11 && ! -e /usr/bin/python3 ]]; then
        ${SUDO_CMD} ln -sf /usr/bin/python3.11 /usr/bin/python3
    fi
    if [[ -f /usr/bin/pip3.11 && ! -e /usr/bin/pip3 ]]; then
        ${SUDO_CMD} ln -sf /usr/bin/pip3.11 /usr/bin/pip3
    fi
    if [[ "${USE_PIP_CMAKE}" == true ]]; then
        ${SUDO_CMD} python3 -m pip install cmake
        export PATH="/usr/local/bin:${PATH}"
    fi
}
